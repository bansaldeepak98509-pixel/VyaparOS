name: Build VyaparOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web assets
        run: |
          rm -rf www
          mkdir -p www
          cp -r .vercel/output/static/. www/
          npm run preview > /tmp/vyaparos-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/ -o www/index.html; then
              break
            fi
            sleep 1
          done
          kill $PREVIEW_PID || true
          test -s www/index.html
          test -d www/assets

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VyaparOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
